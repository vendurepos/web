version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # .npmrc refuses releases younger than a day.
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # TypeScript 7 removed baseUrl (TS5102, #21); lift this when the tsconfig migrates.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
