name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check
      - run: pnpm build
      - run: pnpm test

  # Crawl from / and every built sitemap.xml page; fail on any broken internal link or anchor (marketing backlog items 87 and 92).
  links:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the built site
        run: |
          pnpm start --port 3000 > /tmp/next-start.log 2>&1 &
          for _ in {1..30}; do
            if curl -sf -o /dev/null http://localhost:3000/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/next-start.log
          exit 1
      - name: List link-check seeds
        run: node scripts/sitemap-seeds.mjs > /tmp/link-seeds.txt
      - name: Check internal links
        run: xargs pnpm links:check < /tmp/link-seeds.txt
